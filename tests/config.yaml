reference:
  sample_id: mini_reference
  fasta: "tests/data/reference.fa"
  gff: "tests/data/reference.gff3"

samples: "tests/samples.tsv"
results_dir: "tests/results"
logs_dir: "tests/logs"
work_dir: "tests/work"

software:
  diamond: "diamond"
  gffread: "gffread"

annotation:
  mode: liftoff
  gene_feature_types: [gene]
  pseudogene_feature_types: [gene, pseudogene]
  transcript_feature_types: [mRNA, transcript]
  gene_id_keys: [gene_id, ID]
  gene_name_keys: [gene_name, Name]
  transcript_id_keys: [transcript_id, ID]
  transcript_parent_gene_keys: [gene_id, Parent]
  biotype_keys: [gene_type, gene_biotype, biotype]
  coding_filter_mode: auto
  coding_values: [protein_coding]
  excluded_attribute_terms: [readthrough_gene, readthrough]
  pseudogene_values: [pseudogene, processed_pseudogene, unprocessed_pseudogene]
  strip_id_prefixes: ["gene:", "transcript:"]
  fallback_gene_name_to_id: true

liftoff:
  pixi_environment: "liftoff"
  executable: "liftoff"
  threads: 4

tag:
  diamond_threads: 2
  diamond_max_target_seqs: 5
  blastp_identity: 20
  blastp_query_coverage: 20
  blastp_subject_coverage: 20

pseudogene:
  enabled: true
  search_flank_bp: 50000
  blastx_identity: 20
  blastx_query_coverage: 20
  blastx_subject_coverage: 20

flanks:
  gene_count: 10

merge:
  member_overlap_threshold: 0.3
  require_same_seqid: false

outputs:
  debug: false

refine:
  threads: 2
  flank_overlap_threshold: 0.30

downstream:
  extract:
    threads: 2
  cluster:
    threads: 2
    k: 31
    ubiquitous_threshold: 0.8
    max_clusters: 8
    silhouette_tolerance: 0.05
    min_sequences: 3
    pcoa: true
    seed: 1
    pcoa_jitter_frac: 0.006
    pcoa_point_size: 12
    pcoa_alpha: 0.6
