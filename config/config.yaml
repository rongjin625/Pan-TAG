reference:
  sample_id: chm13
  fasta: /share/home/zhanglab/user/jinrong/tandem_analysis/raw_data/fasta/chm13.fa
  gff: /share/home/zhanglab/user/jinrong/tandem_analysis/raw_data/gff/chm13.gff
samples: /share/home/zhanglab/user/jinrong/tandem_analysis/cluster_after_iteration/Pan_TAG_v0.1/config/samples.tsv
results_dir: results
logs_dir: logs
work_dir: work
software:
  diamond: diamond
  gffread: gffread
annotation:
  mode: provided
  gene_feature_types:
  - gene
  pseudogene_feature_types:
  - gene
  - pseudogene
  transcript_feature_types:
  - mRNA
  - transcript
  gene_id_keys:
  - gene_id
  - ID
  gene_name_keys:
  - gene_name
  - Name
  - gene_symbol
  - gene
  - geneName
  transcript_id_keys:
  - transcript_id
  - ID
  transcript_parent_gene_keys:
  - gene_id
  - Parent
  biotype_keys:
  - gene_type
  - gene_biotype
  - biotype
  coding_filter_mode: auto
  coding_values:
  - protein_coding
  excluded_attribute_terms:
  - readthrough_gene
  - readthrough
  pseudogene_values:
  - pseudogene
  - processed_pseudogene
  - unprocessed_pseudogene
  strip_id_prefixes:
  - 'gene:'
  - 'transcript:'
  fallback_gene_name_to_id: true
liftoff:
  pixi_environment: liftoff
  executable: liftoff
  threads: 8
tag:
  diamond_threads: 4
  diamond_max_target_seqs: 5
  blastp_identity: 20
  blastp_query_coverage: 20
  blastp_subject_coverage: 20
pseudogene:
  enabled: true
  search_flank_bp: 50000
  blastx_identity: 20
  blastx_query_coverage: 20
  blastx_subject_coverage: 20
flanks:
  gene_count: 10
merge:
  member_overlap_threshold: 0.3
  require_same_seqid: false
outputs:
  debug: false
refine:
  threads: 4
  flank_overlap_threshold: 0.3
downstream:
  extract:
    threads: 8
  cluster:
    threads: 8
    k: 31
    ubiquitous_threshold: 0.95
    max_clusters: 0
    silhouette_tolerance: 0.05
    min_sequences: 10
    pcoa: true
    seed: 1
    pcoa_jitter_frac: 0.006
    pcoa_point_size: 15
    pcoa_alpha: 0.6
