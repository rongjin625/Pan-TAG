[workspace]
channels = ["conda-forge", "bioconda"]
name = "pan-tag"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
linux = "3.10"
libc = { family = "glibc", version = "2.17" }

[tasks]
lint = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --lint"
dry-run = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --dry-run --printshellcmds"
run = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --cores 8 --printshellcmds"
build-mcscanx = "bash src/pantag/mcscanx/build.sh"

[dependencies]
python = "3.12.*"
biopython = ">=1.87,<2"
numpy = ">=2.2,<3"
scipy = ">=1.15,<2"
matplotlib-base = "3.9.3.*"
pyyaml = ">=6.0.3,<7"
pysam = "0.23.3.*"
gffread = ">=0.12.9,<0.13"
snakemake = ">=9.23.1,<10"
diamond = ">=2.1,<3"
gxx_linux-64 = "*"

[pypi-dependencies]
pan-tag = { path = ".", editable = true }

[feature.liftoff.dependencies]
python = "3.8.*"

[feature.liftoff.system-requirements]
linux = "3.10"
libc = { family = "glibc", version = "2.17" }

[feature.liftoff.pypi-dependencies]
liftoff = "==1.6.3.2"

[environments]
liftoff = { features = ["liftoff"], no-default-feature = true }
